substitutions:
  friendly_name: Voice PE Arbeitszimmer

packages:
  home-assistant-voice: !include home-assistant-voice.yaml

esphome:
  name: ha-voice-099f06
  friendly_name: ${friendly_name}
  platformio_options:
    extra_scripts:
      # Phase 3.3 profile build — analyzing where the 16-17 ms inference
      # latency on a 15k-MAC model really goes (op-dispatch overhead vs
      # kernel time). Working baseline:
      #   - stack 8 KB (INFERENCE_TASK_STACK_SIZE in our MWW component)
      #   - Conv patch active (esp_nn Conv still aborts at conv.cc:291
      #     even with the bumped stack — Phase 3.2 verdict)
      #   - FC patch off (v1.3.4 upstream fix)
      #   - profile_ops:true in bcresnet_smoke.json wires TFLite Micro's
      #     MicroProfiler into the interpreter; first inference dumps
      #     per-op-type + per-call timings.
      # - pre:../../../patch_esp_nn_fc.py
      # - pre:../../../patch_esp_nn_conv.py  # OFF 2026-06-09 — testing esp_nn conv with reshaped model
      # - pre:../../../patch_esp_nn_conv_logging.py
      - pre:../../../patch_esp_tflite_micro_version.py
      - pre:../../../patch_esp_nn_version.py
      # 1.3.7 re-introduces the C++14 decode_state* kernels + the contradictory
      # -std=c++11/-std=gnu++14 CMakeLists line. Strip the dead c++11 token.
      - pre:../../../patch_esp_tflite_micro_cppstd.py

api:
  encryption:
    key: Qy0E0XoeaM+8hhsUFCunFYvDTTzuRcOvYc5ehQXFa/A=

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
