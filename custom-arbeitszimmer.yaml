substitutions:
  friendly_name: Voice PE Arbeitszimmer

packages:
  home-assistant-voice: !include home-assistant-voice.yaml

esphome:
  name: ha-voice-099f06
  friendly_name: ${friendly_name}
  platformio_options:
    extra_scripts:
      # Phase 3.2 verdict (hardware-validated 2026-05-16):
      #   FC patch   not needed under esp-tflite-micro 1.3.4 + esp-nn 1.2.3.
      #   Conv patch still needed for BC-ResNet (esp_nn/conv.cc abort persists).
      # v1.3.5 attempted but blocked: its new decode_state kernels use C++14
      # syntax while the component's CMakeLists.txt pins -std=c++11; cmake
      # caches that flag across patches in a way we couldn't override from
      # our pre-script layer. See patch_esp_tflite_micro_cppstd.{py,cmake}
      # for the dormant infrastructure.
      # - pre:../../../patch_esp_nn_fc.py
      - pre:../../../patch_esp_nn_conv.py
      - pre:../../../patch_esp_tflite_micro_version.py
      - pre:../../../patch_esp_nn_version.py

api:
  encryption:
    key: Qy0E0XoeaM+8hhsUFCunFYvDTTzuRcOvYc5ehQXFa/A=

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
